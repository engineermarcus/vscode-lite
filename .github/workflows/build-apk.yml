name: Build APK
on:
  push:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set version
        id: ver
        run: |
          CODE=$((100 + ${{ github.run_number }}))
          NAME="1.0.${{ github.run_number }}"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
      - name: Install deps
        run: npm ci
      - name: Ensure TypeScript is present
        run: npm ls typescript --depth=0 || npm install -D typescript
      - name: Build web app
        run: npm run build
        env:
          BASE_URL: /
          VITE_API_URL: https://rtgcortex-vscode-lite.hf.space
          VITE_WS_URL: wss://rtgcortex-vscode-lite.hf.space
      - name: Add Android platform (if missing)
        run: test -d android/app || npx cap add android
      - name: Sync Capacitor
        run: npx cap sync android
      - name: Generate app icons
        run: npx capacitor-assets generate --android
      - name: Set versionCode/versionName in build.gradle
        working-directory: android
        run: |
          sed -i "s/versionCode .*/versionCode ${{ steps.ver.outputs.code }}/" app/build.gradle
          sed -i "s/versionName .*/versionName \"${{ steps.ver.outputs.name }}\"/" app/build.gradle
      - name: Restore constant debug keystore
        env:
          KEYSTORE_BASE64: ${{ vars.DEBUG_KEYSTORE_BASE64 || vars.KEYSTORE_BASE64 || secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          mkdir -p ~/.android
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > ~/.android/debug.keystore
            echo "Loaded constant keystore from repository variable"
          elif [ -f keystore/debug.keystore ]; then
            cp keystore/debug.keystore ~/.android/debug.keystore
            echo "Used local fallback keystore"
          fi
          echo "Keystore SHA256: $(sha256sum ~/.android/debug.keystore | awk '{print $1}')"

      - name: Ensure signing configuration in build.gradle
        working-directory: android
        run: |
          if ! grep -q "signingConfigs" app/build.gradle; then
            sed -i '/buildTypes {/i \    signingConfigs {\n        debug {\n            storeFile file("${System.properties[\x27user.home\x27]}/.android/debug.keystore")\n            storePassword "android"\n            keyAlias "androiddebugkey"\n            keyPassword "android"\n        }\n    }' app/build.gradle
          fi
          echo "--- build.gradle signing configuration ---"
          grep -A14 "signingConfigs\|buildTypes" app/build.gradle
      - name: Build debug APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug
      - name: Verify APK signature
        run: |
          AS=$(ls $ANDROID_HOME/build-tools/*/apksigner | tail -1)
          OUT=$("$AS" verify --verbose android/app/build/outputs/apk/debug/app-debug.apk)
          echo "$OUT"
          echo "$OUT" | grep -q "v2 scheme.*: true" || { echo "NOT v2 signed"; exit 1; }
      - name: Rename APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk \
            out/vscode-lite-${{ steps.ver.outputs.name }}.apk
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.name }}
          name: v${{ steps.ver.outputs.name }}
          files: out/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
