name: backend
on: workflow_dispatch
permissions:
  contents: read
concurrency:
  group: backend
  cancel-in-progress: true
jobs:
  serve:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      WS_REPO: ${{ github.repository_owner }}/vscode-lite-workspace
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
      - run: cd server && npm install --no-audit --no-fund
      - name: Register runner deploy key
        env:
          WS_TOKEN: ${{ secrets.WS_TOKEN }}
        run: |
          set -e
          [ -n "$WS_TOKEN" ] || { echo "missing WS_TOKEN"; exit 1; }
          api() { curl -fsS -H "Authorization: Bearer $WS_TOKEN" -H "Accept: application/vnd.github+json" "$@"; }
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          ssh-keygen -q -t ed25519 -N '' -C vscode-lite-runner -f ~/.ssh/ws
          for id in $(api "https://api.github.com/repos/$WS_REPO/keys?per_page=100" | jq -r '.[] | select(.title=="vscode-lite-runner") | .id'); do
            api -X DELETE "https://api.github.com/repos/$WS_REPO/keys/$id" > /dev/null
          done
          jq -n --arg k "$(cat ~/.ssh/ws.pub)" '{title:"vscode-lite-runner",key:$k,read_only:false}' | api -X POST -d @- "https://api.github.com/repos/$WS_REPO/keys" > /dev/null
          echo "deploy key registered"
      - name: Start workspace, backend and tunnel
        env:
          GH_USER: ${{ github.repository_owner }}
        run: |
          set -e
          export GIT_TERMINAL_PROMPT=0
          cat > "$HOME/nested.sh" << 'NEOF'
          cd "$HOME/workspace" || exit 0
          case "$1" in
            hide)
              find . -mindepth 2 -name .git -not -path './.git/*' -not -path '*/node_modules/*' -prune -print0 |
              while IFS= read -r -d '' g; do [ -e "${g%.git}.git_nested" ] || mv "$g" "${g%.git}.git_nested"; done ;;
            show)
              find . -mindepth 2 -name .git_nested -not -path './.git/*' -prune -print0 |
              while IFS= read -r -d '' g; do [ -e "${g%.git_nested}.git" ] || mv "$g" "${g%.git_nested}.git"; done ;;
          esac
          exit 0
          NEOF
          SSHC="ssh -i $HOME/.ssh/ws -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          export GIT_SSH_COMMAND="$SSHC"
          SESSION_KEY=$(openssl rand -hex 24)
          echo "::add-mask::$SESSION_KEY"
          gitid() { git config user.name "github-actions[bot]"; git config user.email "github-actions[bot]@users.noreply.github.com"; }
          mkdir -p "$HOME/workspace"
          cd "$HOME/workspace"
          git init -q -b main
          gitid
          git config core.sshCommand "$SSHC"
          git remote add origin "git@github.com:$WS_REPO.git"
          FORCE=""
          if git fetch -q origin main; then
            git reset -q --hard FETCH_HEAD
          else
            printf 'node_modules/\n.env\n*.log\n' > .gitignore
            printf '# Workspace\n' > README.md
            git add -A
            git commit -qm "init workspace"
          fi
          if [ "$(git rev-list --count HEAD)" = 1 ] && git fetch -q "https://github.com/$GITHUB_REPOSITORY.git" workspace 2>/dev/null; then
            git reset -q --hard FETCH_HEAD
            FORCE="-f"
            echo "migrated legacy workspace"
          fi
          bash "$HOME/nested.sh" show
          git push -q $FORCE -u origin main || echo "WARN: workspace push failed"
          echo OK > "$HOME/.sync-status"
          nohup bash -c '
            cd "$HOME/workspace" || exit 1
            while true; do
              sleep 30
              find . -path ./.git -prune -o -type f -size +90M -printf "/%P\n" > .git/info/exclude
              bash "$HOME/nested.sh" hide; git add -A; bash "$HOME/nested.sh" show
              if ! git diff --cached --quiet; then
                if git commit -qm autosave && git push -q origin main 2> "$HOME/.sync-err"; then
                  echo OK > "$HOME/.sync-status"
                else
                  echo "FAIL $(tr "\n" " " < "$HOME/.sync-err" | head -c 200)" > "$HOME/.sync-status"
                fi
              fi
            done' > "$HOME/autosave.log" 2>&1 &
          sudo apt-get install -y zsh > /dev/null || true
          mkdir -p "$HOME/.zsh-plugins"
          git clone -q https://github.com/zsh-users/zsh-autosuggestions "$HOME/.zsh-plugins/zsh-autosuggestions" || true
          git clone -q https://github.com/zsh-users/zsh-syntax-highlighting "$HOME/.zsh-plugins/zsh-syntax-highlighting" || true
          cd "$GITHUB_WORKSPACE"
          WORKSPACE="$HOME/workspace" SESSION_KEY="$SESSION_KEY" SYNC_STATUS="$HOME/.sync-status" nohup node server/server.js > server.log 2>&1 &
          sleep 3
          curl -fsSL -o cloudflared "https://github.com/cloudflare/cloudflared/releases/download/2026.10.2/cloudflared-linux-amd64"
          echo "35fbdd2beb378436c7da377d7358cea8e33f9c94a6705d1d8036bf9b0d6d8005  cloudflared" | sha256sum -c -
          chmod +x cloudflared
          nohup ./cloudflared tunnel --no-autoupdate --url http://localhost:3000 > cf.log 2>&1 &
          URL=""
          for i in $(seq 1 30); do
            URL=$(grep -o 'https://[a-z0-9-]*\.trycloudflare\.com' cf.log | head -1 || true)
            [ -n "$URL" ] && break
            sleep 2
          done
          echo "$URL" | grep -Eq '^https://[a-z0-9-]+\.trycloudflare\.com$' || { echo "no tunnel url"; exit 1; }
          echo "::add-mask::$URL"
          OK=0
          for i in $(seq 1 30); do
            CODE=$(curl -s -o /dev/null -m 5 -w '%{http_code}' "$URL/" || true)
            if [ "$CODE" != "000" ] && [ "$CODE" -lt 500 ]; then OK=1; break; fi
            sleep 3
          done
          [ "$OK" = 1 ] || { echo "tunnel unreachable"; exit 1; }
          mkdir -p "$HOME/tun"
          cd "$HOME/tun"
          git init -q -b tunnel
          gitid
          git config core.sshCommand "$SSHC"
          git remote add origin "git@github.com:$WS_REPO.git"
          printf '{"url":"%s","key":"%s","ts":%s}\n' "$URL" "$SESSION_KEY" "$(date +%s)" > tunnel.json
          git add tunnel.json
          git commit -qm tunnel
          git push -q -u origin tunnel --force
          echo "PUBLISHED"
      - name: Keep alive (5h)
        run: sleep 18000
      - name: Save workspace
        if: always()
        run: |
          cd "$HOME/workspace" 2>/dev/null || exit 0
          bash "$HOME/nested.sh" hide; git add -A; bash "$HOME/nested.sh" show
          git diff --cached --quiet || { git commit -qm "save on shutdown"; git push -q origin main || true; }
