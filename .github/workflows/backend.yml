name: backend
on: workflow_dispatch
permissions:
  contents: read
concurrency:
  group: backend
  cancel-in-progress: true
jobs:
  serve:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      WS_TOKEN: ${{ secrets.WS_TOKEN }}
      WS_REPO: ${{ github.repository_owner }}/vscode-lite-workspace
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: cd server && npm install --no-audit --no-fund
      - name: Start backend and Cloudflare tunnel
        run: |
          [ -n "$WS_TOKEN" ] || { echo "missing WS_TOKEN"; exit 1; }
          SESSION_KEY=$(openssl rand -hex 24)
          echo "::add-mask::$SESSION_KEY"
          B64=$(printf 'x-access-token:%s' "$WS_TOKEN" | base64 -w0)
          echo "::add-mask::$B64"
          gitauth() {
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git remote add origin "https://github.com/$WS_REPO.git"
            git config http.https://github.com/.extraheader "AUTHORIZATION: basic $B64"
          }
          mkdir -p "$HOME/workspace" && cd "$HOME/workspace"
          git init -q -b main; gitauth
          if git fetch -q origin main; then
            git reset -q --hard FETCH_HEAD
          else
            printf 'node_modules/\n.env\n*.log\n' > .gitignore
            printf '# Workspace\n' > README.md
            git add -A; git commit -qm "init workspace"
          fi
          git push -q -u origin main || echo "WARN: workspace push failed"
          cd "$GITHUB_WORKSPACE"
          nohup bash -c 'while true; do sleep 60; cd "$HOME/workspace" || continue; git add -A; git diff --cached --quiet || { git commit -qm autosave && git push -q origin main; }; done' > autosave.log 2>&1 &
          WORKSPACE="$HOME/workspace" SESSION_KEY="$SESSION_KEY" nohup env -u WS_TOKEN node server/server.js > server.log 2>&1 &
          sleep 3
          curl -fsSL -o cloudflared https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x cloudflared
          nohup ./cloudflared tunnel --no-autoupdate --url http://localhost:3000 > cf.log 2>&1 &
          URL=""
          for i in $(seq 1 30); do
            URL=$(grep -o 'https://[a-z0-9-]*\.trycloudflare\.com' cf.log | head -1)
            [ -n "$URL" ] && break
            sleep 2
          done
          echo "$URL" | grep -Eq '^https://[a-z0-9-]+\.trycloudflare\.com$' || { echo "no tunnel url"; exit 1; }
          echo "::add-mask::$URL"
          OK=0
          for i in $(seq 1 30); do
            CODE=$(curl -s -o /dev/null -m 5 -w '%{http_code}' "$URL/" || true)
            if [ "$CODE" != "000" ] && [ "$CODE" -lt 500 ]; then OK=1; break; fi
            sleep 3
          done
          [ "$OK" = 1 ] || { echo "unreachable"; exit 1; }
          mkdir -p "$HOME/tun" && cd "$HOME/tun"
          git init -q -b tunnel; gitauth
          echo "{\"url\":\"$URL\",\"key\":\"$SESSION_KEY\",\"ts\":$(date +%s)}" > tunnel.json
          git add tunnel.json; git commit -qm tunnel
          git push -q -u origin tunnel --force
          echo "PUBLISHED"
      - name: Keep alive (5h)
        run: sleep 18000
      - name: Save workspace
        if: always()
        run: |
          cd "$HOME/workspace" 2>/dev/null || exit 0
          git add -A
          git diff --cached --quiet || { git commit -qm "save on shutdown"; git push -q origin main || true; }
