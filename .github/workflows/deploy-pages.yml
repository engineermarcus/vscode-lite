name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Ensure TypeScript is present
        run: npm ls typescript --depth=0 || npm install -D typescript

      - name: Build
        run: npm run build
        env:
          BASE_URL: /vscode-lite/app/
          VITE_API_URL: https://rtgcortex-vscode-lite.hf.space
          VITE_WS_URL: wss://rtgcortex-vscode-lite.hf.space

      - name: Assemble site
        run: |
          mkdir -p site/app
          cp -r dist/. site/app/
          cp landing/index.html site/index.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
